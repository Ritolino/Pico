<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" id="pico-gauge-master">
  <defs>
    <!-- Apple macOS App Icon Shadow -->
    <filter id="macAppShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- Parchment gradients -->
    <linearGradient id="masterSquircleGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FAF3E6"/>
      <stop offset="50%" stop-color="#F5ECD8"/>
      <stop offset="100%" stop-color="#EFE3CB"/>
    </linearGradient>

    <radialGradient id="masterDialGrad" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="70%" stop-color="#FEFAF2"/>
      <stop offset="100%" stop-color="#EEDFC8"/>
    </radialGradient>

    <radialGradient id="masterPinGrad" cx="38%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="22%" stop-color="#E5D8CA"/>
      <stop offset="55%" stop-color="#8F8073"/>
      <stop offset="85%" stop-color="#514237"/>
      <stop offset="100%" stop-color="#2D231C"/>
    </radialGradient>
    
    <filter id="needleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2.5" dy="4.5" stdDeviation="4" flood-color="#282018" flood-opacity="0.25"/>
    </filter>

    <filter id="pinShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="4.5" flood-color="#282018" flood-opacity="0.30"/>
    </filter>

    <!-- Clip to squircle boundary so zero lines protrude outside -->
    <clipPath id="squircleClip">
      <rect x="100.0" y="100.0" width="824.0" height="824.0" rx="185.0" ry="185.0"/>
    </clipPath>
  </defs>

  <!-- Gruppo 1: Contenitore (Squircle macOS con ombra nativa) -->
  <g id="contenitore" filter="url(#macAppShadow)">
    <rect x="100.0" y="100.0" width="824.0" height="824.0" rx="185.0" ry="185.0"
          fill="url(#masterSquircleGrad)"/>
  </g>

  <!-- Contenuto clippato all'interno dello squircle -->
  <g clip-path="url(#squircleClip)">
    <!-- Gruppo 2: Dettagli Decorativi & Linee Tecniche Leonardo (SOLO DIAGONALI E CERCHIO COMPASSO) -->
    <g id="dettagli-decorativi" stroke="#4A3C30" opacity="0.95">
      <!-- Diagonali continue a 45 gradi (spessore 2.5pt marcato Da Vinci) -->
      <line x1="160" y1="864" x2="864" y2="160" stroke-width="2.5"/>
      <line x1="160" y1="160" x2="864" y2="864" stroke-width="2.5"/>

      <!-- Cerchio compasso continuo esterno (spessore 2.2pt) -->
      <circle cx="512" cy="512" r="392.0" fill="none" stroke-width="2.2"/>
    </g>

    <!-- Gruppo 3: Quadrante Circolare (Dial) -->
    <g id="quadrante">
      <circle cx="512" cy="512" r="370.0" fill="none" stroke="#3A3027" stroke-width="3.0"/>
      <circle cx="512" cy="512" r="250.0" fill="url(#masterDialGrad)" stroke="#3A3027" stroke-width="3.0"/>
    </g>

    <!-- Gruppo 4: Settori Colorati (Terracotta, Azzurro Polvere, Verde Salvia) -->
    <g id="settori-colorati" stroke="#3A3027" stroke-width="3.4" stroke-linejoin="round">
      <path id="settore-terracotta" d="M 503.00 142.11 A 370.00 370.00 0 0 0 142.11 503.00 L 262.16 503.00 A 250.00 250.00 0 0 1 503.00 262.16 Z" fill="#E28B58"/>
      <path id="settore-azzurro" d="M 881.89 503.00 A 370.00 370.00 0 0 0 521.00 142.11 L 521.00 262.16 A 250.00 250.00 0 0 1 761.84 503.00 Z" fill="#97ABB4"/>
      <path id="settore-salvia" d="M 142.11 521.00 A 370.00 370.00 0 0 0 881.89 521.00 L 761.84 521.00 A 250.00 250.00 0 0 1 262.16 521.00 Z" fill="#A3AE8D"/>

      <!-- Linee tecniche a 45 gradi interne a TUTTI E 4 I SETTORI (incluso l'azzurro in alto a destra) -->
      <!-- 1. Settore Terracotta (in alto a sinistra, 135 deg) -->
      <line x1="335.2233047033631" y1="335.2233047033631" x2="250.3704909609774" y2="250.3704909609774" stroke="#2B221A" stroke-width="2.5" opacity="0.65"/>
      <!-- 2. Settore Azzurro (in alto a destra, 45 deg) -->
      <line x1="688.776695296637" y1="335.2233047033631" x2="773.6295090390227" y2="250.3704909609774" stroke="#2B221A" stroke-width="2.5" opacity="0.65"/>
      <!-- 3. Settore Salvia a sinistra (in basso a sinistra, 225 deg) -->
      <line x1="335.2233047033631" y1="688.776695296637" x2="250.3704909609774" y2="773.6295090390227" stroke="#2B221A" stroke-width="2.5" opacity="0.65"/>
      <!-- 4. Settore Salvia a destra (in basso a destra, 315 deg) -->
      <line x1="688.776695296637" y1="688.776695296637" x2="773.6295090390227" y2="773.6295090390227" stroke="#2B221A" stroke-width="2.5" opacity="0.65"/>
    </g>

    <!-- Gruppo 5: Lancetta (Needle) -->
    <g id="lancetta" filter="url(#needleShadow)">
      <path id="lancetta-sagoma" d="M 515.98 485.39 L 809.08 267.11 L 538.88 513.17 Z" fill="none" stroke="#2B221A" stroke-width="1.8" stroke-linejoin="round"/>
      <path id="lancetta-luce" d="M 527.43 499.28 L 809.08 267.11 L 515.98 485.39 Z" fill="#9E8F82"/>
      <path id="lancetta-ombra" d="M 527.43 499.28 L 809.08 267.11 L 538.88 513.17 Z" fill="#44382F"/>
      <path id="lancetta-costola" d="M 527.43 499.28 L 809.08 267.11" stroke="#FAF1E6" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Gruppo 6: Perno Centrale (Pin) -->
    <g id="perno-centrale" filter="url(#pinShadow)">
      <circle cx="512" cy="512" r="72.0" fill="url(#masterPinGrad)" stroke="#2B221A" stroke-width="3.5"/>
      <circle cx="512" cy="512" r="63.0" fill="none" stroke="#2B221A" stroke-width="1.2" opacity="0.6"/>
      <circle cx="512" cy="512" r="52.0" fill="none" stroke="#FAF1E6" stroke-width="1.1" opacity="0.8"/>
      <circle cx="512" cy="512" r="40.0" fill="none" stroke="#2B221A" stroke-width="0.9" opacity="0.45"/>
      <circle cx="512" cy="512" r="3.5" fill="#241C16"/>
    </g>
  </g>

  <!-- Bordo grafite e riflesso di luce superiore Apple -->
  <rect x="100.0" y="100.0" width="824.0" height="824.0" rx="185.0" ry="185.0"
        fill="none" stroke="#3A3027" stroke-width="3.6"/>
  <rect x="101.0" y="101.0" width="822.0" height="822.0" rx="184.0" ry="184.0"
        fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"/>
</svg>